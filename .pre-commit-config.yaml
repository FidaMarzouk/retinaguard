repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=500"]
        exclude: ^uv.lock$
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: detect-private-key
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
      # CLAUDE.md: only attributed IDRiD images may live in the repo, under tests/fixtures/.
      - id: no-images-or-weights
        name: no images, weights or datasets outside tests/fixtures
        entry: Images, model weights and datasets must not be committed (see CLAUDE.md).
        language: fail
        files: \.(png|jpe?g|tiff?|bmp|dcm|onnx|pt|pth|ckpt|safetensors|parquet|zip)$
        exclude: ^tests/fixtures/
