[project]
name = "retinaguard"
version = "0.1.0"
description = "Quality-aware, uncertainty-aware diabetic retinopathy screening triage (research prototype, not a medical device)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26,<3",
    "pydantic>=2.7",
]

# Runtime extras per component, so the API image does not pull in Streamlit or Dagster.
[project.optional-dependencies]
api = [
    "retinaguard[data]",  # preprocessing (OpenCV) and lesion constants
    "fastapi>=0.115",
    "onnxruntime>=1.18",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "python-multipart>=0.0.9",
]
app = [
    "httpx>=0.27",
    "streamlit>=1.38",
]
data = [
    "opencv-python-headless>=4.10",
    "pandas>=2.2",
    "pandera>=0.20",
    "pyarrow>=16",
]
pipeline = [
    "retinaguard[data]",
    "dagster>=1.8",
    "dagster-webserver>=1.8",
]
# Kaggle images ship torch, timm, albumentations and scikit-learn; notebooks add hydra-core.
train = [
    "retinaguard[data]",
    "torch>=2.4",
    "torchvision>=0.19",  # used by timm; must come from the same index as torch
    "timm>=1.0",
    "albumentations>=2.0",
    "hydra-core>=1.3",
    "scikit-learn>=1.5",
    "segmentation-models-pytorch>=0.4",
    "onnx>=1.16",
    "onnxscript>=0.1",
]

# Local experiment tracking: imports Kaggle run folders into MLflow (same 2.x line as the server
# in docker-compose.yml).
tracking = [
    "mlflow>=2.17,<3",
    "sqlalchemy>=2.0,<2.1",  # mlflow 2.x imports a pool class that SQLAlchemy 2.1 removed
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "pre-commit>=3.8",
    "dvc>=3.55",
    "pandas-stubs>=3.0.5.260914",
    "matplotlib>=3.9",
    "nbconvert>=7.16",
    "ipykernel>=6.29",
]

# CPU wheels locally and in CI (the default Linux wheels bundle CUDA, ~2.5 GB).
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retinaguard"]

# Ship the Hydra configs inside the package, so a pip install (e.g. on Kaggle) can train.
[tool.hatch.build.targets.wheel.force-include]
"configs" = "retinaguard/configs"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "PT"]
ignore = ["N812"]  # `import torch.nn.functional as F` is the PyTorch convention

[tool.ruff.lint.per-file-ignores]
"notebooks/**" = ["E402"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["retinaguard"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["streamlit.*", "dagster.*", "sklearn.*", "albumentations.*", "segmentation_models_pytorch.*", "onnxruntime.*"]
ignore_missing_imports = true

# MLflow's entity constructors (Metric, Param) are not annotated.
[[tool.mypy.overrides]]
module = ["retinaguard.train.import_runs"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs several components wired together",
    "regression: model-quality gates on fixed fixtures",
    "smoke: short end-to-end training runs on CPU",
]
