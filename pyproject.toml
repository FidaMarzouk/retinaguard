[project]
name = "retinaguard"
version = "0.1.0"
description = "Quality-aware, uncertainty-aware diabetic retinopathy screening triage (research prototype, not a medical device)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26,<3",
    "pydantic>=2.7",
]

# Runtime extras per component, so the API image does not pull in Streamlit or Dagster.
# ML extras (torch, timm, albumentations, ...) are added in Phase 2; see docs/adr/0002.
[project.optional-dependencies]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]
app = [
    "streamlit>=1.38",
]
pipeline = [
    "dagster>=1.8",
    "dagster-webserver>=1.8",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "pre-commit>=3.8",
    "dvc>=3.55",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retinaguard"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "PT"]

[tool.ruff.lint.per-file-ignores]
"notebooks/**" = ["E402"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["retinaguard"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["streamlit.*", "dagster.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs several components wired together",
    "regression: model-quality gates on fixed fixtures",
    "smoke: short end-to-end training runs on CPU",
]
