name: retinaguard

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-retinaguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-retinaguard-dev}
      POSTGRES_DB: ${POSTGRES_DB:-retinaguard}
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.17.2
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
    ports: ["${MLFLOW_PORT:-5000}:5000"]
    volumes: [mlflow:/mlflow]

  api:
    build: { context: ., dockerfile: docker/python.Dockerfile, args: { EXTRA: api } }
    command: uvicorn retinaguard.serving.api:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-retinaguard}:${POSTGRES_PASSWORD:-retinaguard-dev}@postgres:5432/${POSTGRES_DB:-retinaguard}
      MLFLOW_TRACKING_URI: http://mlflow:5000
    ports: ["${API_PORT:-8000}:8000"]
    depends_on:
      postgres: { condition: service_healthy }

  app:
    build: { context: ., dockerfile: docker/python.Dockerfile, args: { EXTRA: app } }
    command: streamlit run src/retinaguard/app/main.py --server.address 0.0.0.0 --server.port 8501
    environment:
      API_URL: http://api:8000
    ports: ["${APP_PORT:-8501}:8501"]
    depends_on: [api]

volumes:
  pgdata:
  mlflow:
