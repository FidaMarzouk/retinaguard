name: retinaguard

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-retinaguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-retinaguard-dev}
      POSTGRES_DB: ${POSTGRES_DB:-retinaguard}
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.17.2
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
    ports: ["${MLFLOW_PORT:-5000}:5000"]
    volumes: [mlflow:/mlflow]

  api:
    build: { context: ., dockerfile: docker/python.Dockerfile, args: { EXTRA: api } }
    # migrate the prediction store, then serve
    command: sh -c "alembic upgrade head && uvicorn retinaguard.serving.api:app --host 0.0.0.0 --port 8000"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-retinaguard}:${POSTGRES_PASSWORD:-retinaguard-dev}@postgres:5432/${POSTGRES_DB:-retinaguard}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODELS_DIR: /srv/models
      DRIFT_HTML_DIR: /srv/drift_reports
      GIT_SHA: ${GIT_SHA:-unknown}
    # exported models (onnx_export output); never baked into the image
    volumes:
      - "${MODELS_DIR:-./outputs/models}:/srv/models:ro"
      - drift_reports:/srv/drift_reports:ro
    ports: ["${API_PORT:-8000}:8000"]
    depends_on:
      postgres: { condition: service_healthy }

  app:
    build: { context: ., dockerfile: docker/python.Dockerfile, args: { EXTRA: app } }
    command: streamlit run src/retinaguard/app/main.py --server.address 0.0.0.0 --server.port 8501
    environment:
      API_URL: http://api:8000
      PUBLIC_API_URL: http://localhost:${API_PORT:-8000}
    ports: ["${APP_PORT:-8501}:8501"]
    depends_on: [api]

  # daily drift report: rates, alert rule and Evidently report per site and day
  monitor:
    build: { context: ., dockerfile: docker/python.Dockerfile, args: { EXTRA: monitoring } }
    command: >
      sh -c "while true; do
      until python -m retinaguard.monitoring.batches report
      --reference /srv/models/reference.json --html-dir /srv/drift_reports; do sleep 30; done;
      sleep 86400; done"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-retinaguard}:${POSTGRES_PASSWORD:-retinaguard-dev}@postgres:5432/${POSTGRES_DB:-retinaguard}
      DO_NOT_TRACK: "1"  # no Evidently telemetry
    volumes:
      - "${MODELS_DIR:-./outputs/models}:/srv/models:ro"
      - drift_reports:/srv/drift_reports
    depends_on: [api]

volumes:
  pgdata:
  drift_reports:
  mlflow:
